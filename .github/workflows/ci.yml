name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - name: Backend lint
        run: npm run lint
      - name: Production configuration contract
        run: npm run verify:prod-config
      - name: Required backend unit tests
        run: npm test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Frontend lint
        run: npm run lint
      - name: Incremental TypeScript check
        run: npm run typecheck
      - name: Production build
        run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Production Compose configuration
        run: docker compose --env-file .env.production.example -f docker-compose.prod.yml config
