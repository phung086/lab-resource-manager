name: Batch 7 Graduation Demo

on:
  pull_request:
    paths:
      - "backend/**"
      - "frontend/**"
      - "docker-compose.prod.yml"
      - ".env.production.example"
      - ".gitattributes"
      - ".github/workflows/batch7-graduation-demo.yml"
  workflow_dispatch:

jobs:
  production-like-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install E2E browser dependencies
        working-directory: frontend
        run: |
          npm ci
          npx playwright-core install --with-deps chromium

      - name: Create isolated production-like environment
        shell: bash
        run: |
          cat > .env.batch7.ci <<'EOF'
          POSTGRES_DB=lab_resources_demo_ci
          POSTGRES_USER=lab_user
          POSTGRES_PASSWORD=Batch7Database!Passphrase
          JWT_SECRET=batch7-production-jwt-secret-at-least-32-characters
          TELEMETRY_API_KEY=batch7-production-telemetry-key-at-least-32-characters
          OPENAI_API_KEY=
          OPENAI_MODEL=
          ADMIN_EMAIL=admin@demo.local
          ADMIN_PASSWORD=Batch7Admin!Passphrase
          ADMIN_FULL_NAME=Demo Administrator
          CORS_ORIGINS=http://127.0.0.1:8080
          JSON_BODY_LIMIT=1mb
          RATE_LIMIT_WINDOW_MS=60000
          RATE_LIMIT_MAX=180
          REMINDER_SCHEDULER_ENABLED=false
          BOOKING_UPCOMING_REMINDER_MINUTES=10080
          RETURN_REMINDER_MINUTES=15
          LOG_FORMAT=combined
          APP_PORT=8080
          PROMETHEUS_PORT=19090
          VITE_APP_NAME=Quản lý phòng thí nghiệm
          VITE_APP_SUBTITLE=Đặt lịch và vận hành thiết bị
          VITE_ENABLE_RESEARCH_FEATURES=false
          EOF

      - name: Validate production Compose configuration
        run: docker compose --env-file .env.batch7.ci -f docker-compose.prod.yml config

      - name: Build and start production-like core stack
        run: |
          docker compose --env-file .env.batch7.ci -f docker-compose.prod.yml up -d --build postgres backend frontend

      - name: Wait for production-like readiness
        shell: bash
        run: |
          set -euo pipefail
          ready=0
          for i in {1..120}; do
            if curl -fsS http://127.0.0.1:8080/health >/dev/null 2>&1 &&
               curl -fsS http://127.0.0.1:8080/api/health/ready | grep -q '"database":"ready"'; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            echo "Production-like stack did not become ready"
            docker compose --env-file .env.batch7.ci -f docker-compose.prod.yml ps
            docker compose --env-file .env.batch7.ci -f docker-compose.prod.yml logs --no-color backend frontend postgres
            exit 1
          fi

          curl -fsS http://127.0.0.1:8080/health | grep -q '^ok'
          curl -fsS http://127.0.0.1:8080/api/health/ready | grep -q '"database":"ready"'

      - name: Bootstrap guarded physical demo infrastructure
        run: |
          docker compose --env-file .env.batch7.ci -f docker-compose.prod.yml exec -T \
            -e DEMO_MODE=true backend npm run demo:seed-infrastructure

      - name: Run the official 10-step graduation demo
        working-directory: frontend
        env:
          BATCH7_FRONTEND_URL: http://127.0.0.1:8080
          BATCH7_ADMIN_EMAIL: admin@demo.local
          BATCH7_ADMIN_PASSWORD: Batch7Admin!Passphrase
        run: npm run test:e2e:demo

      - name: Production security smoke
        shell: bash
        run: |
          set -euo pipefail
          headers="$RUNNER_TEMP/batch7-headers.txt"
          curl -sS -D "$headers" -o /dev/null http://127.0.0.1:8080/
          grep -qi '^x-content-type-options: nosniff' "$headers"
          grep -qi '^x-frame-options: DENY' "$headers"
          grep -qi '^referrer-policy: strict-origin-when-cross-origin' "$headers"

          api_headers="$RUNNER_TEMP/batch7-api-headers.txt"
          curl -sS -D "$api_headers" -o /dev/null \
            -H 'Origin: http://127.0.0.1:8080' \
            http://127.0.0.1:8080/api/health
          grep -qi '^access-control-allow-origin: http://127.0.0.1:8080' "$api_headers"

      - name: Verify database migrations are clean
        run: |
          docker compose --env-file .env.batch7.ci -f docker-compose.prod.yml exec -T backend npx prisma migrate status

      - name: Upload graduation demo screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: batch7-graduation-demo-screenshots
          path: frontend/screenshots_batch7/
          if-no-files-found: ignore

      - name: Dump production-like logs on failure
        if: failure()
        run: |
          docker compose --env-file .env.batch7.ci -f docker-compose.prod.yml ps
          docker compose --env-file .env.batch7.ci -f docker-compose.prod.yml logs --no-color backend frontend postgres

      - name: Stop production-like stack
        if: always()
        run: docker compose --env-file .env.batch7.ci -f docker-compose.prod.yml down -v --remove-orphans
