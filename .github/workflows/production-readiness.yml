name: Production readiness

on:
  pull_request:
    paths: ['backend/**', 'frontend/**', 'docker-compose.prod.yml', '.github/workflows/production-readiness.yml']
  workflow_dispatch:

jobs:
  current-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: release-ci-only
        ports: ['25439:5432']
        options: --health-cmd 'pg_isready -U postgres' --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      RELEASE_TEST_ADMIN_URL: postgresql://postgres:release-ci-only@127.0.0.1:25439/postgres
      FULFILLMENT_TEST_DATABASE_URL: postgresql://postgres:release-ci-only@127.0.0.1:25439/lab_resources_booking_fulfillment_test
      PAYMENT_HOLD_TEST_DATABASE_URL: postgresql://postgres:release-ci-only@127.0.0.1:25439/lab_resources_payment_hold_test
      CHATGPT_BRIDGE_ENABLED: 'false'
      MCP_ASSISTANT_ENABLED: 'false'
      OPENAI_API_KEY: ''
      SMTP_HOST: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - name: Install locked dependencies
        run: |
          (cd backend && npm ci && npm run db:generate)
          (cd frontend && npm ci)
      - name: Static, current contracts and runtime dependency audits
        run: |
          set -euo pipefail
          (cd backend && npm run lint && npm run verify:prod-config && npm run docs:erd:check && npm run test:required && npm audit --omit=dev)
          (cd frontend && npm run test:required && npm audit --omit=dev)
      - name: Isolated PostgreSQL integration matrix
        working-directory: backend
        run: npm run test:release:integration
      - name: Install Chromium for real browser regressions
        working-directory: frontend
        run: npx playwright-core install --with-deps chromium
      - name: Booking, payment hold and calendar browser contracts
        working-directory: frontend
        env:
          VITE_API_BASE_URL: /api
          VITE_ENABLE_PAYMENT_FEATURES: 'true'
          VITE_ENABLE_AI_ASSISTANT: 'true'
        run: |
          set -euo pipefail
          node node_modules/vite/bin/vite.js --host 127.0.0.1 --port 5173 > /tmp/lab-vite.log 2>&1 &
          VITE_PID=$!
          trap 'kill "$VITE_PID"' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:5173 >/dev/null; then break; fi
            sleep 1
          done
          npm run test:ui:fulfillment
          npm run test:ui:payment-hold
          npm run test:ui:calendar-planner
      - name: Preserve isolated test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: isolated-release-diagnostics
          path: backend/logs/
          if-no-files-found: ignore

  production-images:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      POSTGRES_DB: lab_resources_production_smoke_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: release-ci-only
      JWT_SECRET: production-ci-fixture-secret-at-least-32-characters
      ADMIN_EMAIL: admin@production.qa.test
      ADMIN_PASSWORD: ProductionQa!2026TestOnly
      ADMIN_FULL_NAME: Production QA
      APP_PORT: 127.0.0.1:25440
      CORS_ORIGINS: http://127.0.0.1:25440
      VITE_APP_NAME: LAB QA
      VITE_APP_SUBTITLE: Production image verification
      MCP_ASSISTANT_ENABLED: 'true'
      CHATGPT_BRIDGE_ENABLED: 'true'
      CHATGPT_BRIDGE_PUBLIC_ORIGIN: https://lab.qa.invalid
      CHATGPT_BRIDGE_UI_ORIGIN: https://lab.qa.invalid
      CHATGPT_BRIDGE_SECRET_KEY: BwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwc=
      EMAIL_AUTOMATION_ENABLED: 'false'
      REMINDER_SCHEDULER_ENABLED: 'false'
      RELEASE_SMOKE_EMAIL: admin@production.qa.test
      RELEASE_SMOKE_PASSWORD: ProductionQa!2026TestOnly
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build and start isolated production images
        run: docker compose -p lrm-production-smoke -f docker-compose.prod.yml up -d --build --wait --wait-timeout 180
      - name: Verify actual Nginx, API, OAuth and database boundary
        run: node backend/scripts/checkProductionSmoke.mjs
      - name: Stop disposable CI stack
        if: always()
        run: docker compose -p lrm-production-smoke -f docker-compose.prod.yml down --volumes
