name: Batch 5 Backend Regression

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/batch5-regression.yml"
  workflow_dispatch:

jobs:
  backend-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci
      - run: npx prisma generate

      - name: Verify canonical historical migration bytes
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { createHash } from "node:crypto";
          import { readFile, writeFile } from "node:fs/promises";
          import path from "node:path";

          const baseline = JSON.parse(await readFile("../docs/BATCH1B_VERIFICATION.json", "utf8"));
          const sha256 = (value) => createHash("sha256").update(value).digest("hex");

          for (const [name, expected] of Object.entries(baseline.migrationFiles)) {
            const file = path.join("prisma", "migrations", name, "migration.sql");
            const current = await readFile(file);
            const currentHash = sha256(current);

            if (currentHash === expected) {
              console.log(`migration hash OK: ${name} ${currentHash}`);
              continue;
            }

            // Historical migration checksums were captured on the verified
            // Batch 1 Windows workspace. Git can materialize text files with
            // LF on Linux runners. Normalize only the ephemeral CI working
            // tree when and only when the canonical CRLF byte representation
            // reproduces the recorded verified checksum exactly.
            const text = current.toString("utf8").replace(/\r\n/g, "\n");
            const lf = Buffer.from(text, "utf8");
            const crlf = Buffer.from(text.replace(/\n/g, "\r\n"), "utf8");
            const withoutFinalLf = Buffer.from(text.replace(/\n$/, ""), "utf8");
            const withoutFinalCrlf = Buffer.from(text.replace(/\n$/, "").replace(/\n/g, "\r\n"), "utf8");
            const bom = Buffer.from([0xef, 0xbb, 0xbf]);
            const candidates = [
              ["lf", lf],
              ["crlf", crlf],
              ["lf-no-final-newline", withoutFinalLf],
              ["crlf-no-final-newline", withoutFinalCrlf],
              ["bom-lf", Buffer.concat([bom, lf])],
              ["bom-crlf", Buffer.concat([bom, crlf])],
              ["bom-lf-no-final-newline", Buffer.concat([bom, withoutFinalLf])],
              ["bom-crlf-no-final-newline", Buffer.concat([bom, withoutFinalCrlf])]
            ];
            const canonical = candidates.find(([, bytes]) => sha256(bytes) === expected);

            if (!canonical) {
              const variants = candidates.map(([label, bytes]) => `${label}=${sha256(bytes)}`).join(", ");
              throw new Error(
                `Historical migration checksum mismatch for ${name}: current=${currentHash}, expected=${expected}; variants: ${variants}`
              );
            }

            const [representation, canonicalBytes] = canonical;
            await writeFile(file, canonicalBytes);
            const finalHash = sha256(await readFile(file));
            if (finalHash !== expected) {
              throw new Error(`Failed to materialize canonical bytes for ${name}`);
            }
            console.log(`migration working-tree bytes normalized in CI: ${name} representation=${representation} hash=${finalHash}`);
          }
          NODE

      - name: Configure guarded local test base URL
        shell: bash
        run: |
          cat > .env <<'EOF'
          DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:5432/postgres?schema=public
          JWT_SECRET=batch5-ci-base-secret-at-least-32-characters
          CORS_ORIGINS=http://127.0.0.1:5177
          PORT=5002
          EOF

      - name: Create isolated PostgreSQL 16 databases
        shell: bash
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          for db in \
            lab_resources_b1d_ci \
            lab_resources_b1e_ci \
            lab_resources_b2_auth_ci \
            lab_resources_b3_resource_ci \
            lab_resources_b4_booking_ci \
            lab_resources_b5_operations_ci
          do
            psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE \"$db\";"
          done

      - name: Apply immutable migration history to every isolated database
        shell: bash
        run: |
          set -euo pipefail
          for db in \
            lab_resources_b1d_ci \
            lab_resources_b1e_ci \
            lab_resources_b2_auth_ci \
            lab_resources_b3_resource_ci \
            lab_resources_b4_booking_ci \
            lab_resources_b5_operations_ci
          do
            echo "::group::migrate:$db"
            DATABASE_URL="postgresql://postgres:postgres@127.0.0.1:5432/$db?schema=public" npx prisma migrate deploy
            echo "::endgroup::"
          done

      - name: Core tests
        run: npm run test:core

      - name: Batch 1 persistence and concurrency
        shell: bash
        run: |
          set -euo pipefail
          BATCH1D_DATABASES=lab_resources_b1d_ci node --test test/bookingConcurrency.db.test.js
          BATCH1D_DATABASES=lab_resources_b1d_ci node --test test/persistenceMigration.test.js

      - name: Batch 1E runtime regression
        run: BATCH1E_DATABASE=lab_resources_b1e_ci node --test test/batch1e/integration.runtime.test.js

      - name: Batch 2 auth/RBAC regression
        run: BATCH2_DATABASE=lab_resources_b2_auth_ci npm run test:batch2

      - name: Batch 3 resource regression
        run: BATCH3_DATABASE=lab_resources_b3_resource_ci npm run test:batch3

      - name: Batch 4 and 4.1 booking/calendar regression
        run: BATCH4_DATABASE=lab_resources_b4_booking_ci npm run test:batch4

      - name: Batch 5 operational workflow
        run: BATCH5_DATABASE=lab_resources_b5_operations_ci npm run test:batch5
