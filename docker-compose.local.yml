# One shared local backend/database for both frontend checkouts.
name: lrm-local-review
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    environment:
      POSTGRES_USER: lab_user
      POSTGRES_PASSWORD: local-review-only
      POSTGRES_DB: lab_resources_local_demo
    volumes:
      - review-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lab_user -d lab_resources_local_demo"]
      interval: 2s
      timeout: 3s
      retries: 30
  backend:
    image: lrm-local-review-backend:latest
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    build:
      context: ./backend
      target: dev
    init: true
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      NODE_ENV: development
      DEMO_MODE: "true"
      DATABASE_URL: postgresql://lab_user:local-review-only@postgres:5432/lab_resources_local_demo
      JWT_SECRET: lrm-local-review-only-not-for-production-2026
      PORT: "8000"
      LOG_FORMAT: dev
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173,http://localhost:5180,http://127.0.0.1:5180
      REMINDER_SCHEDULER_ENABLED: "false"
      PAYMENTS_ENABLED: "false"
      MCP_ASSISTANT_ENABLED: "true"
    command: ["sh", "-c", "npm run db:migrate && npm run demo:seed-local && npm run dev"]
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./backend/src:/app/src:ro
      - ./backend/scripts:/app/scripts:ro
      - ./backend/prisma:/app/prisma:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8000/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 3s
      timeout: 5s
      start_period: 120s
      retries: 20
volumes:
  review-data:
