services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: lab_resources
      POSTGRES_USER: lab_user
      POSTGRES_PASSWORD: lab_password
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lab_user -d lab_resources"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      target: dev
    environment:
      DATABASE_URL: postgresql://lab_user:lab_password@postgres:5432/lab_resources
      JWT_SECRET: local-dev-secret
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      MCP_ASSISTANT_ENABLED: ${MCP_ASSISTANT_ENABLED:-false}
      ASSISTANT_MAX_CONCURRENT: ${ASSISTANT_MAX_CONCURRENT:-4}
      ASSISTANT_TIMEOUT_MS: ${ASSISTANT_TIMEOUT_MS:-30000}
      ASSISTANT_TOOL_TIMEOUT_MS: ${ASSISTANT_TOOL_TIMEOUT_MS:-10000}
      ASSISTANT_RATE_LIMIT_PER_MINUTE: ${ASSISTANT_RATE_LIMIT_PER_MINUTE:-6}
      ASSISTANT_MODEL_FAILURE_THRESHOLD: ${ASSISTANT_MODEL_FAILURE_THRESHOLD:-3}
      ASSISTANT_MODEL_COOLDOWN_MS: ${ASSISTANT_MODEL_COOLDOWN_MS:-30000}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_FULL_NAME: ${ADMIN_FULL_NAME:-}
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      REMINDER_SCHEDULER_ENABLED: ${REMINDER_SCHEDULER_ENABLED:-true}
      LOG_FORMAT: ${LRM_LOG_FORMAT:-dev}
    ports:
      - "8000:8000"
    volumes:
      - ./backend/src:/app/src
      - ./backend/scripts:/app/scripts
      - ./backend/prisma:/app/prisma
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      target: dev
    environment:
      VITE_API_BASE_URL: http://localhost:8000
      VITE_ENABLE_RESEARCH_FEATURES: ${VITE_ENABLE_RESEARCH_FEATURES:-false}
      VITE_ENABLE_AI_ASSISTANT: ${VITE_ENABLE_AI_ASSISTANT:-false}
      VITE_ENABLE_TELEMETRY_FEATURES: ${VITE_ENABLE_TELEMETRY_FEATURES:-false}
      VITE_ENABLE_PAYMENT_FEATURES: ${VITE_ENABLE_PAYMENT_FEATURES:-false}
    ports:
      - "5173:5173"
    volumes:
      - ./frontend/src:/app/src
    depends_on:
      - backend

  prometheus:
    image: prom/prometheus:v3.0.1
    ports:
      - "9090:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - backend
      - node-exporter

  node-exporter:
    image: prom/node-exporter:v1.8.2
    ports:
      - "9100:9100"

  dcgm-exporter:
    image: nvcr.io/nvidia/k8s/dcgm-exporter:4.1.3-4.0.4-ubuntu22.04
    profiles: ["gpu"]
    cap_add:
      - SYS_ADMIN
    ports:
      - "9400:9400"

volumes:
  postgres-data:
