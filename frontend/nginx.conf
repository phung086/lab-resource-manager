server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;
  set $lrm_private_cache_control "";
  client_max_body_size 2m;
  sendfile on;
  tcp_nopush on;
  sendfile_max_chunk 1m;
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types application/json application/javascript text/css image/svg+xml;

  # Vite content hashes allow long caching; missing assets must not become HTML.
  location /assets/ {
    expires 1y;
    try_files $uri =404;
  }

  # Static media is served by Nginx, never by the API/SPA. Limit range fan-out;
  # single byte ranges still support native video seeking (206/416).
  location /media/ {
    try_files $uri =404;
    expires 1d;
    max_ranges 1;
    open_file_cache max=128 inactive=60s;
    open_file_cache_valid 60s;
    open_file_cache_errors off;
    access_log off;
  }

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Cache-Control $lrm_private_cache_control always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; media-src 'self' https:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;

  location = /health {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # OAuth discovery and MCP are backend protocols, never SPA fallback routes.
  # Keep OAuth codes/state out of Nginx URL logs and stream MCP responses.
  location ~ ^/(?:api/|oauth/chatgpt(?:/|$)|\.well-known/oauth-(?:authorization-server|protected-resource)(?:/|$)|mcp(?:/|$)) {
    access_log off;
    proxy_pass http://backend:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_send_timeout 60s;
    proxy_read_timeout 75s;
    proxy_buffering off;
  }

  location = / { try_files /index.html =404; }
  location ~ ^/(resources|schedule|how-it-works)/$ { return 308 /$1$is_args$args; }
  location ~ ^/(resources|schedule|how-it-works)$ { try_files $uri/index.html =404; }
  location ~ ^/(?:workspace(?:/|$)|login$|register$) { set $lrm_private_cache_control "no-store"; try_files /private.html =404; }
  # Unknown URLs are real 404s, not a 200 soft-error SPA page.
  location = /private.html { internal; set $lrm_private_cache_control "no-store"; }
  location / { error_page 404 /private.html; try_files $uri =404; }
}
